name: EAS Build APK

on:
  push:
    branches:
      - master  # Menjalankan build otomatis saat push ke branch master
  workflow_dispatch: # Memungkinkan kamu menjalankan build manual dari tab Actions

jobs:
  build:
    name: Install and Build APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Build Standalone APK (Preview)
        run: eas build --profile preview --platform android --non-interactive

      - name: 📤 Comment Build Link on Commit
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number || 0, // Hanya jika lewat PR
              body: "🚀 Build Standalone APK sedang diproses di Expo Cloud. Cek dashboard Expo Anda!"
            });
